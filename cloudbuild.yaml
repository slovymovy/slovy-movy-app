steps:
  # Build the server
  - name: 'eclipse-temurin:21-jdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update
        apt-get install -y --no-install-recommends git
        ./gradlew :server:installDist -x test --build-cache --no-daemon

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/open-words-backend:$BRANCH_NAME-$SHORT_SHA', './server' ]

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/open-words-backend:$BRANCH_NAME-$SHORT_SHA' ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'open-words-backend'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/open-words-backend:$BRANCH_NAME-$SHORT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/open-words-backend:$BRANCH_NAME-$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
