name: CI Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests-linux-host:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false  # Keep Android SDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: verify localization keys
        run: ./gradlew :composeApp:verifyLocalizationKeys

      - name: run shared tests
        env:
          ACCESS_TO_GH_TOKEN: ${{ secrets.ACCESS_TO_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISTUDIO_KEY: ${{ secrets.AISTUDIO_KEY }}
        run: ./gradlew :shared:allTests

      - name: run Android unit tests
        env:
          ACCESS_TO_GH_TOKEN: ${{ secrets.ACCESS_TO_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISTUDIO_KEY: ${{ secrets.AISTUDIO_KEY }}
        run: ./gradlew :composeApp:testAndroidHostTest :androidApp:testMinifiedTestUnitTest

      - name: Upload test results and reports (Linux host)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-host
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  tests-desktop-jvm:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: run compose desktop JVM tests
        env:
          ACCESS_TO_GH_TOKEN: ${{ secrets.ACCESS_TO_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISTUDIO_KEY: ${{ secrets.AISTUDIO_KEY }}
        run: ./gradlew :composeApp:desktopTest

      - name: Upload test results and reports (desktop JVM)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-desktop-jvm
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
            **/build/test-results/**

  tests-server:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: run server tests
        env:
          ACCESS_TO_GH_TOKEN: ${{ secrets.ACCESS_TO_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISTUDIO_KEY: ${{ secrets.AISTUDIO_KEY }}
        run: ./gradlew :server:test

      - name: Upload test results and reports (server)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-server
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
            **/build/test-results/**

  tests-android-connected:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
            arch: x86
          - api-level: 29
            target: default
            arch: x86
          - api-level: 34
            target: google_apis
            arch: x86_64
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false  # Keep Android SDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Clean old AVD data on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - cleaning old AVD data"
          rm -rf ~/.android/avd/* || true
          rm -rf ~/.android/adb* || true

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          disk-size: 2048
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ACCESS_TO_GH_TOKEN: ${{ secrets.ACCESS_TO_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISTUDIO_KEY: ${{ secrets.AISTUDIO_KEY }}
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          disk-size: 2048
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :composeApp:connectedAndroidDeviceTest :androidApp:connectedAndroidTest; status=$?; killall -INT crashpad_handler 2>/dev/null || true; exit $status

      - name: Upload test results and reports (Android connected)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android-connected-api-${{ matrix.api-level }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  tests-macos-arm64:
    timeout-minutes: 30
    runs-on: macos-26
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: run iOS simulator arm64 tests
        env:
          SDK_NAME: iphonesimulator
          ACCESS_TO_GH_TOKEN: ${{ secrets.ACCESS_TO_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISTUDIO_KEY: ${{ secrets.AISTUDIO_KEY }}
        run: ./gradlew iosSimulatorArm64Test

      - name: Upload test results and reports (macOS arm64)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos-arm64
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
            **/build/test-results/**

